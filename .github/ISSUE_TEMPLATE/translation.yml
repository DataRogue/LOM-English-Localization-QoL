name: Translation problem
description: A line that is wrong, unclear, inconsistent, or still in Chinese.
labels: [translation]
body:
  - type: textarea
    id: where
    attributes:
      label: Where does it appear?
      description: The scene, character or menu, and roughly where in the story (chapter, event). A screenshot is ideal.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: The text as it appears now
      description: The English line (and the Chinese, if you can see it, for example by switching the language).
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What it should say
      description: Your suggestion, and why (a mistranslation, a name that differs elsewhere, a tone that doesn't fit ...).
    validations:
      required: false
